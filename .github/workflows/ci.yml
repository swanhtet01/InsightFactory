name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Bytecode compile
        run: |
          python -m py_compile api.py helpers/drive_browser.py helpers/drive_sync.py helpers/drive_watcher.py helpers/live_kpi_pipeline.py helpers/document_processor.py helpers/claims_pipeline.py helpers/html_report.py helpers/research_planner.py helpers/integration_clients.py helpers/run_history.py helpers/pipeline_runner.py helpers/data_profiler.py
      - name: Test suite
        run: pytest -q
