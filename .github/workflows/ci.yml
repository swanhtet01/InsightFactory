name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint and Test
        run: |
          python -m py_compile helpers/drive_browser.py helpers/drive_sync.py helpers/drive_watcher.py helpers/live_kpi_pipeline.py helpers/document_processor.py helpers/claims_pipeline.py
          python -m unittest tests/test_pipelines.py tests/test_drive_sync.py
